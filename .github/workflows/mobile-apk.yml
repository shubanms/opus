name: Mobile APK

# Builds the React Native (Expo) app into an installable debug APK WITHOUT EAS:
# npm install -> expo prebuild -> gradle assembleDebug. Runs on PRs touching the
# mobile app so the native build can be iterated to green before merge.
on:
  push:
    branches: ['main']
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-apk.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - '.github/workflows/mobile-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install shared core
        working-directory: packages/core
        run: npm install --no-audit --no-fund

      - name: Install mobile app
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Expo prebuild (android)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: opus-mobile-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # On merges to main (or manual dispatch), publish the native APK as a
      # directly-downloadable GitHub Release asset — no login needed to install
      # on a phone. assembleDebug is debug-signed, so it sideloads fine.
      - name: Rename APK for release
        if: github.event_name != 'pull_request'
        run: |
          mv apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk \
             opus-mobile-build-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-build-${{ github.run_number }}
          name: OPUS Mobile (native) build-${{ github.run_number }}
          body: >-
            Native React Native + Expo build of OPUS. Download the APK below and
            install on Android (enable "install from unknown sources"). Features:
            offline workout logging (SQLite), streak/XP/PRs, notifications,
            Health Connect step import, and home-screen widgets.
          files: opus-mobile-build-${{ github.run_number }}.apk
