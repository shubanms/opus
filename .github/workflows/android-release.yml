name: Android Release

on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    # Tag push → use the tag (v1.2.3); manual dispatch → use the input;
    # plain push to main → an auto-incrementing build-N release so each
    # merge to main produces a downloadable APK in the Releases tab.
    env:
      VERSION: >-
        ${{ inputs.version
            || (startsWith(github.ref, 'refs/tags/') && github.ref_name)
            || format('build-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 7+ requires Node >= 22 (the existing deploy.yml
          # is unaffected — it doesn't shell out to @capacitor/cli).
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor Android (current version) compiles against Java 21
          # ('error: invalid source release: 21' on Java 17). Local builds
          # confirmed working on JDK 21.
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web bundle for Capacitor
        run: npm run build
        env:
          CAPACITOR_BUILD: 'true'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release-unsigned.apk \
             opus-${{ env.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Opus ${{ env.VERSION }}
          body: |
            Android APK build for Opus ${{ env.VERSION }}

            Install on your Android device:
            1. Download the APK below
            2. Enable "Install from unknown sources" if prompted
            3. Open the APK to install
          files: opus-${{ env.VERSION }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
