<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#100E0C" />
    <meta name="description" content="OPUS — Build your masterpiece. A free, offline-first gym tracker." />

    <!--
      Ink is dark-only. Stamp theme, sky and the effects flag before first
      paint, since main.jsx only applies them once the bundle has run. Mirrors
      utils/theme.js (resolveSky) and settingsStore's `effects` flag; any
      failure leaves the defaults.
    -->
    <script>
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('opus_prefs') || '{}') || {};
          var root = document.documentElement;
          var sky = prefs.sky;
          if (sky !== 'dawn' && sky !== 'dusk' && sky !== 'night') {
            var h = new Date().getHours();
            sky = h >= 5 && h < 11 ? 'dawn' : h >= 11 && h < 19 ? 'dusk' : 'night';
          }
          root.setAttribute('data-theme', 'dark');
          root.setAttribute('data-sky', sky);
          root.setAttribute('data-fx', prefs.effects === false ? 'off' : 'on');
        } catch (e) {
          /* storage blocked or corrupt: the app applies its defaults on boot */
        }
      })();
    </script>

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OPUS" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="icon" type="image/png" href="%BASE_URL%icon-192.png" />

    <title>OPUS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
