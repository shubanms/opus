<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPUS</title>
  <style>
    :root { --obsidian: #111010; --chalk: #F7F5F2; --gold: #C9A84C; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--obsidian);
      color: var(--chalk);
      font-family: Georgia, 'Times New Roman', serif;
      text-align: center;
    }
    h1 {
      font-size: 4rem;
      letter-spacing: 1.2rem;
      text-indent: 1.2rem;
      font-weight: 700;
    }
    p {
      margin-top: 1rem;
      font-size: 0.85rem;
      letter-spacing: 0.35rem;
      text-transform: uppercase;
      color: var(--gold);
      font-family: -apple-system, system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <h1>OPUS</h1>
  <p>Build your masterpiece.</p>
</body>
</html>
