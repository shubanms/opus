# Maestro smoke flow — launches the installed OPUS APK on an emulator and proves
# it gets PAST the splash to a real screen (the exact failure we shipped in
# build-17: stuck on the loading spinner). Run by .github/workflows/mobile-e2e.yml.
appId: com.shubanms.opus.mobile
---
- launchApp:
    clearState: true
# The Home hero text only renders once fonts/DB are ready — so seeing it proves
# the startup gate released (no infinite splash).
- assertVisible:
    text: "Ready to train?"
    timeout: 45000
- assertVisible: "OPUS"
# Navigate to another tab to prove the app is interactive, not a static frame.
- tapOn: "Workout"
- assertVisible:
    text: "Workout"
    timeout: 10000
- tapOn: "Exercises"
- assertVisible:
    text: "tap to log"
    timeout: 10000
- takeScreenshot: opus-home
